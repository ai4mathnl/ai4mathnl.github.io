title: "Shaping the Future of Mathematics with AI"
tagline: "A half-day workshop at CWI Amsterdam"
description: >-
  A half-day workshop on developing a shared vision for the future of
  mathematics in the age of AI. Thursday 3 December 2026, 13:00-17:00, CWI
  Amsterdam.
url: "https://ai4mathnl.github.io"
baseurl: ""

# Workshop facts live here so the page, the metadata and any future pages all
# read them from one place.
workshop:
  date: "Thursday 3 December 2026"
  date_iso: "2026-12-03"
  time: "13:00 - 17:00"
  venue: "CWI"
  venue_full: "Centrum Wiskunde & Informatica"
  address: "Science Park 123, 1098 XG Amsterdam"
  # UTC stamps for the calendar file. December is CET, so UTC+1.
  start_utc: "20261203T120000Z"
  end_utc: "20261203T160000Z"
  # Fill in once registration opens; the button appears automatically.
  registration_url: ""
  contact_email: ""

# The organising body. The list of people lives in _data/organisers.yml.
organiser:
  name: "AIM"
  full_name: "AIM &mdash; AI &amp; Mathematics in the Netherlands"
  url: "https://aimath.nl"
  logo: "/assets/img/aim-logo.png"

# A second logo in the hero. Name and URL live here with the organiser's.
partner:
  name: "NWO"
  full_name: "Dutch Research Council (NWO)"
  url: "https://www.nwo.nl/"
  logo: "/assets/img/nwo-logo.svg"

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
