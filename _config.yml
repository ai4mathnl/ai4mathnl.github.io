title: "AI4Math Workshop: Shaping the Future of Mathematics with AI"
tagline: "A half-day workshop at CWI Amsterdam"
description: >-
  A half-day workshop on developing a shared vision for the future of
  mathematics in the age of AI. Friday 4 December 2026, 09:30-15:00, CWI
  Amsterdam.
url: "https://ai4math.nl"
baseurl: ""

# Workshop facts live here so the page, the metadata and any future pages all
# read them from one place.
workshop:
  date: "Friday 4 December 2026"
  date_iso: "2026-12-04"
  time: "09:30 - 15:00"
  venue: "CWI"
  venue_full: "Centrum Wiskunde & Informatica"
  venue_url: "https://www.cwi.nl/en/about/visitor-information/"
  room: "Turing room"
  address: "Science Park 123, 1098 XG Amsterdam"
  # UTC stamps for the calendar file. December is CET, so UTC+1.
  start_utc: "20261204T083000Z"
  end_utc: "20261204T140000Z"
  # Registration and payment run through CWI's store, which refuses to be
  # embedded, so /register/ links out to it. Empty this to close registration.
  registration_url: "https://store.cwi.nl/catalogue/AI4Math_183/"
  registration_fee: "€35"
  contact_email: ""

# The organising body. The list of people lives in _data/organisers.yml.
organiser:
  name: "AIM"
  full_name: "AIM &mdash; AI &amp; Mathematics in the Netherlands"
  url: "https://aimath.nl"
  logo: "/assets/img/aim-logo.png"

plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
